name: Clojure CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: DeLaGuardo/setup-clojure@main
      with:
        bb: '1.12.217'
    - name: Run tests
      run: bb test
